name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q pyti_app tests docs main.py commands.py
          editor.py highlighter.py level.py playing_field.py pyti.py

      - name: Check Python module size limit
        run: python -m unittest tests.test_module_sizes -v

      - name: Smoke-test application UI
        run: >-
          python -c "from pathlib import Path; from PySide6.QtWidgets import QApplication;
          from pyti_app.ui_builder import baue_ui;
          app = QApplication([]);
          widgets = baue_ui(Path.cwd(), []);
          assert widgets.window is not None;
          widgets.window.close()"
